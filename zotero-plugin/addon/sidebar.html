<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zocrates</title>
  <link rel="stylesheet" href="sidebar.css" type="text/css" />
  <link rel="stylesheet" href="lib/katex.min.css" type="text/css" />
</head>
<body>
  <!-- Sessions Drawer Panel -->
  <div id="sessions-drawer" class="sessions-drawer hidden">
    <div class="drawer-header">
      <h2>Sessions</h2>
      <button id="close-drawer-btn" title="Close Menu">✕</button>
    </div>
    <div class="drawer-content">
      <button id="new-chat-btn" class="new-chat-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
       New Session
      </button>
      <div class="sessions-search-container">
        <input type="text" id="sessions-search-input" placeholder="search sessions..." autocomplete="off" />
      </div>
      <div id="sessions-list" class="sessions-list">
        <!-- Loaded dynamically in JS -->
      </div>
    </div>
  </div>

  <!-- Notifications Drawer Panel (Slides in from Right) -->
  <div id="notifications-drawer" class="notifications-drawer hidden">
    <div class="drawer-header">
      <h2>Notifications</h2>
      <button id="close-notifications-btn" title="Close Menu">✕</button>
    </div>
    <div class="drawer-content" style="display: flex; flex-direction: column; justify-content: space-between; height: calc(100% - 60px);">
      <!-- Pinned Active Batch Task Container -->
      <div id="batch-progress-container" class="batch-progress-container hidden"></div>

      <div id="notifications-list" class="notifications-list" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
        <!-- Dynamic notifications loaded here -->
      </div>
      <button id="clear-notifications-btn" class="new-chat-btn" style="background-color: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444; margin-top: 16px;">
        Clear All
      </button>
    </div>
  </div>

  <div id="drawer-overlay" class="drawer-overlay hidden"></div>

  <header>
    <div class="brand" style="display: flex; align-items: center;">
      <button id="menu-toggle-btn" class="header-icon-btn" title="Chat Sessions">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <h1 style="margin-left: 8px;">Zocrates</h1>
    </div>
    <div class="header-actions-group" style="display: flex; align-items: center; gap: 6px;">
      <!-- Detach / Attach Window Toggle Button -->
      <button id="window-toggle-btn" class="header-icon-btn" title="Detach Sidebar">
        <!-- Detach Icon -->
        <svg id="detach-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        <!-- Attach Icon -->
        <svg id="attach-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="transform: rotate(180deg);"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
      </button>

      <button id="notification-toggle-btn" class="header-icon-btn" title="Notifications" style="position: relative;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span id="notification-badge" class="badge-dot hidden" style="position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%; box-shadow: 0 0 6px #ef4444;"></span>
      </button>
      
      <div class="header-right-menu">
        <button id="more-actions-btn" class="header-icon-btn" title="More Options">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
        
        <!-- More Actions Dropdown Menu -->
        <div id="more-actions-dropdown" class="dropdown-menu hidden">
          <button id="settings-btn" class="dropdown-item" title="Zocrates Settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Zocrates Settings
          </button>

          <button id="network-graph-menu-btn" class="dropdown-item" title="Open Network Graph Visualizer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 15c-1.1 0-2.07.57-2.63 1.43L10.9 13.7c.07-.22.1-.46.1-.7 0-.24-.03-.48-.1-.7l5.47-2.73C16.93 10.43 17.9 11 19 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.03.48.1.7L7.63 11.43C7.07 10.57 6.1 10 5 10c-1.66 0-3 1.34-3 3s1.34 3 3 3c1.1 0 2.07-.57 2.63-1.43l5.47 2.73c-.07.22-.1.46-.1.7 0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3z"/></svg>
            Paper Network Graph
          </button>

          <button id="sync-btn" class="dropdown-item" title="Scan Zotero library and update the local search index with new or modified items">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
            Update Library Index
          </button>

          <button id="library-conversion-status-menu-btn" class="dropdown-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            Library Conversion Status
          </button>

          <div id="theme-menu-container" style="position: relative; width: 100%;">
            <button id="theme-menu-option" class="dropdown-item" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
              <span style="display: flex; align-items: center; gap: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2A10 10 0 1 0 22 12 10 10 0 0 0 12 2zm0 1.5a8.5 8.5 0 0 1 6.01 14.51L5.49 5.99A8.44 8.44 0 0 1 12 3.5z"/></svg>
                Change Theme
              </span>
              <svg class="chevron-right" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor; opacity:0.8;"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </button>
            <div id="theme-options-dropdown" class="dropdown-menu hidden">
              <button class="dropdown-item theme-option-btn" data-theme="auto">Zotero (Auto)</button>
              <button class="dropdown-item theme-option-btn" data-theme="slate">Slate Dark</button>
              <button class="dropdown-item theme-option-btn" data-theme="amoled">Amoled Dark</button>
              <button class="dropdown-item theme-option-btn" data-theme="sepia">Sepia</button>
            </div>
          </div>

          <div id="about-menu-container" style="position: relative; width: 100%;">
            <button id="about-menu-option" class="dropdown-item" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
              <span style="display: flex; align-items: center; gap: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                About
              </span>
              <svg class="chevron-right" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor; opacity:0.8;"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </button>
            <div id="about-options-dropdown" class="dropdown-menu hidden">
              <button id="about-advanced-settings-btn" class="dropdown-item">Advanced Settings...</button>
              <button id="about-hardware-btn" class="dropdown-item">Detected Hardware</button>
              <button id="about-info-btn" class="dropdown-item">Zocrates Info</button>
              <button id="about-report-issue-btn" class="dropdown-item">Report Issue</button>
            </div>
          </div>

          <div class="dropdown-status-item" id="dropdown-status-item">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Local Backend: Checking...</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Registration overlay for first-time use -->
    <div id="registration-panel" class="hidden">
      <h2>Welcome to Zocrates</h2>
      <p>Click below to link this Zotero profile and start indexing your research papers locally.</p>
      <button id="register-btn" class="btn-primary">Link Zotero Library</button>
    </div>

    <!-- Phase 7 Onboarding host (bootstrap progress card + CONFIGURE wizard +
         PROCESS progress). A dedicated host OUTSIDE #chat-messages so session
         loads, session-list clicks, and New Chat can never destroy the card. -->
    <div id="onboarding-container" class="onboarding-container"></div>

    <!-- Chat Messages -->
    <div id="chat-messages"></div>

    <!-- Consolidated Chat Input Section -->
    <div class="chat-input-container">
      <div class="chat-input-box">



        <!-- Dynamic Active Chips Row Container -->
        <div class="active-chips-row-container">
          <!-- + Button and Dropdown Menu -->
          <div style="position: relative; display: flex; align-items: center;">
            <button id="add-context-btn" class="add-context-btn" title="Add context (items, collections, library)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            
            <!-- Context Options Dropdown Menu (Opens upwards) -->
            <div id="context-options-dropdown" class="dropdown-menu hidden" style="bottom: 30px; left: 0; top: auto; width: 265px; min-width: 265px; z-index: 600;">
              <button id="add-current-view-option" class="dropdown-item" style="display: none; align-items: center; gap: 8px;">
                <span id="add-current-view-icon" style="display: flex; align-items: center; flex-shrink: 0;"></span>
                <span id="add-current-view-text" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; text-align: left;"></span>
              </button>
              <div id="current-view-separator" class="dropdown-separator" style="display: none; height: 1px; background-color: rgba(255,255,255,0.08); margin: 6px 0;"></div>

              <button id="add-selected-papers-option" class="dropdown-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                Selected Items/Papers
              </button>
              
              <div id="collections-menu-container" style="position: relative; width: 100%;">
                <button id="add-collection-option" class="dropdown-item" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                  <span style="display: flex; align-items: center; gap: 10px;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    Collections
                  </span>
                  <svg class="chevron-right" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor; opacity:0.8;"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                </button>
                
                <!-- Submenu for Collections List (opens to the right/upwards) -->
                <div id="collections-submenu" class="dropdown-menu hidden">
                  <!-- Populated dynamically -->
                </div>
              </div>

              <button id="add-library-option" class="dropdown-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                Entire Library
              </button>
            </div>
          </div>

          <!-- Dynamic Active Chips list -->
          <div id="chips-container" class="active-chips-list">
            <!-- Dynamic paper chips inserted here -->
          </div>

          <!-- Chips Action Group (Clear all + Sticky toggle) -->
          <div class="chips-actions-group">
            <button id="clear-all-chips-btn" class="clear-all-chips-btn hidden" title="Clear all active context">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
            <button id="toggle-sticky-btn" class="toggle-sticky-btn" title="Sticky mode (pin selected items/papers)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
            </button>
          </div>
        </div>

        <!-- Input Text Area & Send Button -->
        <div class="input-row">
          <div class="chat-input-wrap">
            <div id="ghost-input-overlay" class="ghost-input-overlay" style="display: none;"><span id="ghost-input-text" class="ghost-input-text"></span><span class="ghost-input-hint">Tab ⇥</span></div>
            <textarea id="chat-input" placeholder="Have a dialogue with Zocrates!" rows="2"></textarea>
          </div>
          <button id="send-btn" class="send-btn" title="Send Message (Ctrl/Cmd + Enter)">
            <svg class="send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            <div class="stop-icon"></div>
          </button>
        </div>
      </div>

      <!-- Outside footer dropdowns & links -->
      <div class="chat-input-footer" style="position: relative;">
        <div class="footer-left" style="display: flex; align-items: center; width: 100%; gap: 6px;">
          <!-- Session Stats Button on the left side -->
          <div class="footer-stats-btn" id="session-stats-btn" role="button" tabindex="0" title="Session Statistics" aria-label="Session Statistics">
            <svg xmlns="http://www.w3.org/2000/svg" class="stats-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
          </div>

          <div class="footer-model-info" style="margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--text-muted, #888); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 450px; min-width: 0; text-align: right; user-select: text;" title="Active LLM Model">
            <span id="model-name-display">Connecting...</span>
          </div>
        </div>

        <!-- Session Stats Popover -->
        <div id="session-stats-popover" class="session-stats-popover hidden">
          <div class="stats-popover-header">
            <span class="stats-popover-title">Session Usage</span>
            <span class="stats-popover-turns" id="stats-turns-count">0 turns</span>
          </div>
          <div class="stats-popover-grid">
            <div class="stats-grid-item">
              <span class="stats-item-label">Price</span>
              <span class="stats-item-val" id="stats-cost-val">$0.00</span>
            </div>
            <div class="stats-grid-item">
              <span class="stats-item-label">Tokens</span>
              <span class="stats-item-val" id="stats-tokens-val">0</span>
            </div>
          </div>
          <div class="stats-popover-breakdown" id="stats-breakdown-row" style="display: none;">
            <div class="stats-breakdown-item"><span id="stats-prompt-tokens">Input: 0</span></div>
            <div class="stats-breakdown-item"><span id="stats-candidates-tokens">Output: 0</span></div>
            <div class="stats-breakdown-item" id="stats-cached-tokens-item" style="display: none;"><span id="stats-cached-tokens">Cached: 0</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="lib/marked.min.js"></script>
  <script src="lib/katex.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/infoModal.js"></script>
  <script src="lib/scholarImport.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
