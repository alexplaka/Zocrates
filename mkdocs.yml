site_name: Zocrates
site_description: An LLM-powered assistant copilot for Zotero.
site_url: https://alexplaka.github.io/Zocrates/docs/
repo_url: https://github.com/alexplaka/Zocrates
exclude_docs: "gen_ref_pages.py"

theme:
  name: material
  palette:
    # Scheme toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Scheme toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            members: true
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            separate_signature: true
            merge_init_into_class: true
            filters:
              - "!^_"

nav:
  - Home: index.md
  - Architecture:
      - Agent Orchestration & Discovery:
          - Dialogue Agent & Coordination: architecture/dialogue-agent.md
          - Human-In-The-Loop Deep Research: architecture/hitl-deep-research.md
          - Citations & Decision-Model Verification: architecture/citations-and-verification.md
          - Adaptive Context Compaction: architecture/adaptive-context-compaction.md
          - Online Literature Discovery & Import: architecture/online-literature-discovery.md
          - Predictive Next-Prompt Engine: architecture/predictive-next-prompt.md
      - Document Ingestion & Knowledge Bundles:
          - Document Conversion & Layouts: architecture/document-conversion.md
          - OKF Document Bundles & Invariants: architecture/okf-bundles-and-invariants.md
          - Embeddings & Hybrid Search: architecture/embeddings-and-search.md
          - Long-Term Memory & User Directives: architecture/user-curated-memory.md
      - Desktop Bridge & Visualizations:
          - Reader Excerpts & Context Pills: architecture/reader-and-context-pills.md
          - Paper Relations Graph & Visualizer: architecture/paper-relations-graph.md
          - Mermaid Diagrams & Sidebar: architecture/mermaid-diagrams.md
      - Runtime, Security & Governance:
          - Models & Provider Hybridization: architecture/models-and-providers.md
          - Security, IPC & Privilege Isolation: architecture/security-and-ipc.md
          - Backend Distribution & Supervision: architecture/distribution-and-runtime.md
          - Session Lifecycle & Space Reclamation: architecture/session-lifecycle.md
          - Opt-In Error & Diagnostic Reporting: architecture/diagnostic-reporting.md
  - User Guides:
      - "Why Zocrates: A Guide for Scholars": guides/why-zocrates.md
      - Local MCP Server Client Setup: guides/mcp-server-setup.md
  - API Reference: reference/

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
